name: حرّاس الأمان

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# تقييد الصلاحيات لأدنى حد ممكن دفاعياً لمنع حقن المهام أو تسريب التوكنات
permissions:
  contents: read

jobs:
  code-guardrails:
    name: فحص طبقة الكود والأسرار (security:check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24e6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest
      - name: تثبيت الحزم
        run: bun install --frozen-lockfile
      - name: حرّاس الأمان — الكود والأسرار
        run: bun run security:check
      - name: مصفوفة صلاحيات لوحة الإدارة
        run: bun run rbac:matrix
      - name: اتساق بوابة العرض مع سجل التنقل
        run: bun run rbac:nav
      - name: حارس المسارات التشخيصية والمؤقتة
        run: bun run routes:guardrails
      - name: حارس سلامة إدخال المستندات
        run: bun run documents:guardrails

  dependency-audit:
    name: فحص سلسلة التوريد وثغرات الحزم
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24e6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest
      - name: تثبيت الحزم
        run: bun install --frozen-lockfile
      - name: ثغرات عالية/حرجة في الحزم
        run: bun audit --audit-level=high

  db-guardrails:
    name: فحص طبقة قاعدة البيانات (security-guardrails.sql)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24e6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest
      - name: تثبيت الحزم
        run: bun install --frozen-lockfile
      - name: تثبيت عميل psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: التحقّق من توفّر سرّ الاتصال
        env:
          DATABASE_URL: ${{ secrets.SECURITY_CHECK_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::السرّ SECURITY_CHECK_DATABASE_URL غير مضبوط في إعدادات المستودع؛ لا يمكن تنفيذ فحوص قاعدة البيانات."
            exit 1
          fi
      - name: حرّاس الأمان — قاعدة البيانات
        env:
          DATABASE_URL: ${{ secrets.SECURITY_CHECK_DATABASE_URL }}
        run: bun run security:db
