services:
  # خادم منصة مِهلة القانونية (TanStack Start SSR)
  mehla_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mehla_app
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    expose:
      - "3000"
    networks:
      - mehla_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # خادم البروكسي العكسي Nginx مع حماية وتشفير SSL التلقائي
  mehla_proxy:
    image: nginx:alpine
    container_name: mehla_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - mehla_app
    networks:
      - mehla_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  mehla_network:
    driver: bridge
